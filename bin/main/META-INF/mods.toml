modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = ""

[[mods]]
modId = "ragdollcorpsecleaner"
version = "${file.jarVersion}"
displayName = "Ragdoll Corpse Cleaner"
authors = "takapii_kun0717"
description = '''
ragdollified 用のアドオンMOD。
/ragdollified clear コマンドで、ラグドール化されたモブの死体をまとめて削除できるようにします。
'''

[[dependencies.ragdollcorpsecleaner]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.ragdollcorpsecleaner]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

# ragdollified 本体が無いと動かないので必須依存として明記する
[[dependencies.ragdollcorpsecleaner]]
    modId = "ragdollified"
    mandatory = true
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "BOTH"
